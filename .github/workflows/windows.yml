name: Windows

on:
  # Branches only: a release tag points at a commit these already tested. Only changes that can
  # affect the build or the tests start a run (not docs, packaging or editor settings).
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'core/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Same toolchain and location as the README, so the debug preset works unchanged.
      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.12.0
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtmultimedia qtshadertools qtimageformats qttasktree
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          dir: 'C:\'
          cache: true
          # aqtinstall 3.3 can't install Qt 6.11+ on Windows; every workflow uses this commit until 3.4.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      - name: Install CMake and Ninja
        run: pip install cmake ninja

      # tst_ffmpegintegration skips itself without ffmpeg. Uses the build pinned in
      # cmake/BundleFfmpeg.cmake, not Chocolatey's: its ffmpeg.exe is a launcher shim, and killing
      # the shim on cancel leaves the real ffmpeg running and holding the output file.
      - name: Install FFmpeg
        shell: pwsh
        run: |
          $name = 'ffmpeg-9.0.2-essentials_build'
          $zip = "$env:RUNNER_TEMP\$name.zip"
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/$name.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') { throw "Unexpected SHA-256: $hash" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "CLIPVIEWER_FFMPEG_DIR=$env:RUNNER_TEMP\$name\bin" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug
