name: Linux

on:
  # Branches only: a release tag points at a commit these already tested. Only changes that can
  # affect the build or the tests start a run (not docs, packaging or editor settings).
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'core/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev

      # tst_ffmpegintegration skips itself without ffmpeg. Uses the build pinned in
      # cmake/BundleFfmpeg.cmake, the one release builds ship, not Ubuntu's older package.
      - name: Install FFmpeg
        run: |
          dir="$RUNNER_TEMP/ffmpeg"
          base=https://ffmpeg.martin-riedl.de/download/linux/amd64/1789931100_9.0.2
          mkdir -p "$dir"
          curl -fsSL "$base/ffmpeg.zip" -o "$RUNNER_TEMP/ffmpeg.zip"
          curl -fsSL "$base/ffprobe.zip" -o "$RUNNER_TEMP/ffprobe.zip"
          sha256sum -c <<EOF
          fa8ecf4abbd290d98f7d188b8649cc6b391ae209a98452be955a15aab1909d7f  $RUNNER_TEMP/ffmpeg.zip
          3f428c49070be3d24ec338602b76d412e401ffcb8a5641ef0e729181a232fc32  $RUNNER_TEMP/ffprobe.zip
          EOF
          unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$dir"
          unzip -q "$RUNNER_TEMP/ffprobe.zip" -d "$dir"
          chmod +x "$dir/ffmpeg" "$dir/ffprobe"
          "$dir/ffmpeg" -hide_banner -version | head -1
          echo "CLIPVIEWER_FFMPEG_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.12.0
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtshadertools qtimageformats qttasktree
          cache: true
          # aqtinstall 3.3 can't install Qt 6.11+ on Windows; every workflow uses this commit until 3.4.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      # The unix presets find Qt through QT_ROOT.
      - name: Set QT_ROOT
        run: echo "QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      # The system Python refuses pip installs (PEP 668).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install CMake and Ninja
        run: pip install cmake ninja

      - name: Configure
        run: cmake --preset unix-debug

      - name: Build
        run: cmake --build --preset unix-debug

      - name: Test
        run: ctest --preset unix-debug
