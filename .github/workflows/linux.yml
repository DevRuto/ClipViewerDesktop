name: Linux

on:
  # Branches only: a release tag points at a commit these already tested. Only changes that can
  # affect the build or the tests start a run (not docs, packaging or editor settings).
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'core/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.12.0
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtshadertools qtimageformats qttasktree
          cache: true
          # aqtinstall 3.3 can't install Qt 6.11+ on Windows; every workflow uses this commit until 3.4.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      # The unix presets find Qt through QT_ROOT.
      - name: Set QT_ROOT
        run: echo "QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      # The system Python refuses pip installs (PEP 668).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install CMake and Ninja
        run: pip install cmake ninja

      - name: Configure
        run: cmake --preset unix-debug

      - name: Build
        run: cmake --build --preset unix-debug

      - name: Test
        run: ctest --preset unix-debug
